services:
  vertex-control-center:
    build: .
    container_name: vertex-control-center
    ports:
      - "${MC_PORT:-3000}:${PORT:-3000}"
    environment:
      - PORT=${PORT:-3000}
    env_file:
      - path: .env
        required: false
    volumes:
      - vcc-data:/app/.data
      # Docker socket para sandbox de execução de testes (opcional)
      # Remova esta linha se não quiser habilitar o sandbox Docker
      - /var/run/docker.sock:/var/run/docker.sock
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
          pids: 256
    networks:
      - vcc-net
    restart: unless-stopped

volumes:
  vcc-data:

networks:
  vcc-net:
    driver: bridge
