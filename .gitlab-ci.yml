workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $CALLBACK_INFRA_STATUS == null'
      when: never
    - when: always

stages:
  - validate
  - release
  - deploy
  - disparo
  - callback

variables:
  AWS_DEFAULT_REGION: us-east-1
  S3_BUCKET: efi-aura-releases-823196744369
  S3_PREFIX: releases
  SSM_DOCUMENT: efi-aura-deploy
  SSM_DOC_VERSION: "5"
  TARGET_INSTANCE: i-0c7c2bb068ed75adf
  BUILD_SECRET: aura/prod/build
  RELEASE_NAME: "${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
  DEPLOY_WAIT_SECONDS: "2700"
  INFRA_REF: "master"
  TAG_REGEX: '^v[0-9]+\.[0-9]+\.[0-9]+$'

.node:
  image: node:22-bullseye-slim
  tags:
    - docker
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.15.1 --activate
    - pnpm --version

.node_aws:
  image: node:22-bullseye-slim
  tags:
    - docker
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.15.1 --activate
    - |
      set -e

      # O Bullseye encerrou o LTS. Utilizamos os repositórios históricos,
      # nos quais os pacotes referenciados pelos índices permanecem disponíveis.
      printf '%s\n' \
        'deb http://archive.debian.org/debian bullseye main' \
        'deb http://archive.debian.org/debian-security bullseye-security main' \
        > /etc/apt/sources.list

      rm -f /etc/apt/sources.list.d/*.list
      rm -rf /var/lib/apt/lists/*

      apt-get \
        -o Acquire::Check-Valid-Until=false \
        -o Acquire::Retries=3 \
        update

      apt-get install -y --no-install-recommends \
        curl unzip jq tar gzip ca-certificates

      command -v curl >/dev/null || {
        echo "ERRO: curl ausente apos apt-get install"
        exit 1
      }

      command -v unzip >/dev/null || {
        echo "ERRO: unzip ausente apos apt-get install"
        exit 1
      }

      command -v jq >/dev/null || {
        echo "ERRO: jq ausente apos apt-get install"
        exit 1
      }

      rm -rf /var/lib/apt/lists/*
    - curl -fsS "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscli.zip
    - unzip -q /tmp/awscli.zip -d /tmp
    - /tmp/aws/install >/dev/null
    - aws --version

.aws:
  image:
    name: amazon/aws-cli:latest
    entrypoint:
      - ""
  tags:
    - docker
  before_script:
    - yum install -y jq >/dev/null 2>&1 || true
    - aws --version

.alpine:
  image: alpine:3.20
  tags:
    - docker
  before_script:
    - apk add --no-cache curl jq coreutils >/dev/null

validate:
  extends: .node
  stage: validate
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm build
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

release:
  extends: .node_aws
  stage: release
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - aws sts get-caller-identity --query Arn --output text
    - |
      SEG=$(aws secretsmanager get-secret-value \
        --secret-id "$BUILD_SECRET" \
        --query SecretString \
        --output text)

      N=$(printf '%s' "$SEG" | jq -r 'keys | length')

      echo "segredo de build: $N variaveis"

      if [ "$N" -lt 5 ]; then
        echo "ERRO: segredo de build com apenas $N chaves"
        exit 1
      fi

      while IFS='=' read -r k v; do
        export "$k=$v"
      done < <(
        printf '%s' "$SEG" |
          jq -r 'to_entries[] | "\(.key)=\(.value)"'
      )

      unset SEG

      env |
        grep -c '^NEXT_PUBLIC_' |
        xargs echo "NEXT_PUBLIC_ exportadas:"
    - pnpm install --frozen-lockfile
    - pnpm build
    - mkdir -p .next/standalone/public
    - mkdir -p .next/standalone/.next/static
    - cp -a .next/static/. .next/standalone/.next/static/
    - cp -a public/. .next/standalone/public/
    - mkdir -p .next/standalone/src/lib
    - cp src/lib/schema-mysql.sql .next/standalone/src/lib/schema-mysql.sql
    - mkdir -p .next/standalone/skills
    - cp -r skills/. .next/standalone/skills/
    - test -f .next/standalone/server.js
    - |
      tar czf artefato.tgz \
        -C .next/standalone \
        --no-wildcards-match-slash \
        --exclude='./.git' \
        --exclude='./.git/*' \
        --exclude='./tests' \
        --exclude='./docs' \
        --exclude='./e2e*' \
        --exclude='./playwright*' \
        --exclude='./*.md' \
        --exclude='./docker*' \
        --exclude='./Vagrantfile' \
        --exclude='./.env' \
        --exclude='./.env.*' \
        .

      ls -l artefato.tgz

      tar tzf artefato.tgz |
        wc -l |
        xargs echo "entradas no pacote:"

      tar tzf artefato.tgz > /tmp/pacote.txt

      for proibido in \
        .git \
        DEPLOY_SIMPLES.md \
        DEPLOY_GUIA.md \
        docker-compose.yml \
        Vagrantfile \
        .env
      do
        if grep -qxF "./$proibido" /tmp/pacote.txt ||
           grep -qF "./$proibido/" /tmp/pacote.txt
        then
          echo "ERRO: $proibido entrou no artefato"
          exit 1
        fi
      done

      for exigido in \
        ./server.js \
        ./src/lib/schema-mysql.sql
      do
        if ! grep -qxF "$exigido" /tmp/pacote.txt; then
          echo "ERRO: $exigido ausente do artefato"
          exit 1
        fi
      done

      if ! grep -qF './.next/static/' /tmp/pacote.txt; then
        echo "ERRO: .next/static ausente"
        exit 1
      fi

      if ! grep -qF './public/' /tmp/pacote.txt; then
        echo "ERRO: public ausente"
        exit 1
      fi

      N_SKILL=$(grep -c '/SKILL\.md$' /tmp/pacote.txt || true)

      if [ "${N_SKILL:-0}" -lt 1 ]; then
        echo "ERRO: nenhum SKILL.md no artefato"
        exit 1
      fi

      echo "SKILL.md no pacote: $N_SKILL"
      echo "conferido: nada proibido e o essencial esta presente"
    - |
      SHA=$(sha256sum artefato.tgz | awk '{print $1}')

      echo "$SHA" > artefato.sha256
      echo "release=$RELEASE_NAME sha256=$SHA"

      aws s3 cp \
        artefato.tgz \
        "s3://$S3_BUCKET/$S3_PREFIX/$RELEASE_NAME.tar.gz" \
        --only-show-errors

      aws s3 cp \
        artefato.sha256 \
        "s3://$S3_BUCKET/$S3_PREFIX/$RELEASE_NAME.sha256" \
        --only-show-errors

      echo "publicado em s3://$S3_BUCKET/$S3_PREFIX/$RELEASE_NAME.tar.gz"
  artifacts:
    paths:
      - artefato.sha256
    expire_in: 30 days
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store
    policy: pull

deploy:
  extends: .aws
  stage: deploy
  when: manual
  resource_group: deploy-aura
  timeout: 55m
  needs:
    - release
  environment:
    name: teste
    url: https://aura.interno.testesejaefi.com.br
  rules:
    - if: '$CI_COMMIT_BRANCH == "master" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - |
      SHA=$(cat artefato.sha256)

      echo "implantando $RELEASE_NAME (sha256 $SHA)"

      CID=$(aws ssm send-command \
        --instance-ids "$TARGET_INSTANCE" \
        --document-name "$SSM_DOCUMENT" \
        --document-version "$SSM_DOC_VERSION" \
        --parameters "Version=$RELEASE_NAME,Sha256=$SHA" \
        --timeout-seconds "$DEPLOY_WAIT_SECONDS" \
        --query 'Command.CommandId' \
        --output text)

      echo "CommandId: $CID"

      FIM=$(( $(date +%s) + DEPLOY_WAIT_SECONDS ))
      ST=Pending

      while [ "$(date +%s)" -lt "$FIM" ]; do
        sleep 10

        ST=$(aws ssm get-command-invocation \
          --command-id "$CID" \
          --instance-id "$TARGET_INSTANCE" \
          --query Status \
          --output text 2>/dev/null || echo Pending)

        case "$ST" in
          Success|Failed|Cancelled|TimedOut)
            break
            ;;
        esac

        echo "... $ST"
      done

      echo "--------- saida do deploy ---------"

      aws ssm get-command-invocation \
        --command-id "$CID" \
        --instance-id "$TARGET_INSTANCE" \
        --query StandardOutputContent \
        --output text || true

      echo "-----------------------------------"

      if [ "$ST" != "Success" ]; then
        echo "DEPLOY NAO CONCLUIDO. status=$ST"

        if [ "$ST" = "Failed" ]; then
          echo "O documento reverte sozinho; confira a saida acima."
        fi

        case "$ST" in
          Pending|InProgress|Delayed)
            echo "Estado indeterminado. CommandId=$CID"
            ;;
        esac

        exit 1
      fi

      echo "deploy concluido: $RELEASE_NAME"

rollback:
  extends: .aws
  stage: deploy
  when: manual
  resource_group: deploy-aura
  timeout: 55m
  needs: []
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $ROLLBACK_VERSION'
  script:
    - |
      if [ -z "$ROLLBACK_VERSION" ]; then
        echo "Informe ROLLBACK_VERSION ao rodar o pipeline"
        exit 1
      fi

      echo "revertendo para $ROLLBACK_VERSION"

      SHA=$(aws s3 cp \
        "s3://$S3_BUCKET/$S3_PREFIX/$ROLLBACK_VERSION.sha256" \
        - 2>/dev/null |
        tr -d '[:space:]')

      if [ -z "$SHA" ]; then
        echo "ERRO: nao achei o sha256 de $ROLLBACK_VERSION no bucket"
        exit 1
      fi

      CID=$(aws ssm send-command \
        --instance-ids "$TARGET_INSTANCE" \
        --document-name "$SSM_DOCUMENT" \
        --document-version "$SSM_DOC_VERSION" \
        --parameters "Version=$ROLLBACK_VERSION,Sha256=$SHA" \
        --timeout-seconds "$DEPLOY_WAIT_SECONDS" \
        --query 'Command.CommandId' \
        --output text)

      echo "CommandId: $CID"

      FIM=$(( $(date +%s) + DEPLOY_WAIT_SECONDS ))
      ST=Pending

      while [ "$(date +%s)" -lt "$FIM" ]; do
        sleep 10

        ST=$(aws ssm get-command-invocation \
          --command-id "$CID" \
          --instance-id "$TARGET_INSTANCE" \
          --query Status \
          --output text 2>/dev/null || echo Pending)

        case "$ST" in
          Success|Failed|Cancelled|TimedOut)
            break
            ;;
        esac
      done

      aws ssm get-command-invocation \
        --command-id "$CID" \
        --instance-id "$TARGET_INSTANCE" \
        --query StandardOutputContent \
        --output text || true

      if [ "$ST" != "Success" ]; then
        echo "rollback nao concluido: $ST"
        exit 1
      fi

      echo "rollback concluido: $ROLLBACK_VERSION"

disparar-esteira:
  extends: .alpine
  stage: disparo
  needs: []
  resource_group: deploy-aura
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: on_success
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_TAG'
      when: on_success
  script:
    - |
      set -eu

      echo "tag empurrada: ${CI_COMMIT_TAG}"
      echo "commit: ${CI_COMMIT_SHA}"
      echo "autor: ${GITLAB_USER_NAME:-?} <${GITLAB_USER_EMAIL:-?}>"

      if ! echo "${CI_COMMIT_TAG}" | grep -Eq "${TAG_REGEX}"; then
        echo "ERRO: a tag '${CI_COMMIT_TAG}' nao segue o padrao vX.Y.Z."
        echo "Apague a tag errada e crie a tag correta."
        exit 1
      fi

      if [ -z "${DEPLOY_TRIGGER_TOKEN:-}" ]; then
        echo "ERRO: DEPLOY_TRIGGER_TOKEN chegou vazia."
        echo "Confira se a tag esta protegida no GitLab."
        exit 1
      fi

      if [ -z "${DEPLOY_TRIGGER_URL:-}" ]; then
        echo "ERRO: DEPLOY_TRIGGER_URL chegou vazia."
        exit 1
      fi

      echo "disparando a esteira de infraestrutura"

      RESP=$(curl -sS -k -X POST \
        -o /tmp/trigger.json \
        -w '%{http_code}' \
        -F "token=${DEPLOY_TRIGGER_TOKEN}" \
        -F "ref=${INFRA_REF}" \
        -F "variables[GN_VERSAO_APP]=${CI_COMMIT_TAG}" \
        -F "variables[APP_COMMIT_SHA]=${CI_COMMIT_SHA}" \
        -F "variables[APP_PIPELINE_URL]=${CI_PIPELINE_URL}" \
        "${DEPLOY_TRIGGER_URL}") || {
          echo "ERRO: o curl nao completou."
          exit 1
        }

      echo "HTTP ${RESP}"

      if [ "${RESP}" != "201" ]; then
        echo "ERRO: o trigger nao criou o pipeline."
        cat /tmp/trigger.json 2>/dev/null || true
        exit 1
      fi

      PID=$(jq -r '.id // empty' /tmp/trigger.json)
      WEB=$(jq -r '.web_url // empty' /tmp/trigger.json)

      echo "pipeline de infraestrutura criado: id=${PID:-?}"
      echo "acompanhe em: ${WEB:-sem_url}"

receber-callback:
  extends: .alpine
  stage: callback
  needs: []
  timeout: 10m
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger" && $CALLBACK_INFRA_STATUS'
      when: always
  script:
    - |
      set -eu

      echo "callback da esteira de infraestrutura"
      echo "versao: ${GN_VERSAO_APP:-vazio}"
      echo "ambiente: ${CALLBACK_INFRA_ENV:-vazio}"
      echo "status: ${CALLBACK_INFRA_STATUS:-vazio}"
      echo "--------------- log da infraestrutura ---------------"

      if [ -n "${CALLBACK_INFRA_BODY:-}" ]; then
        printf '%s' "${CALLBACK_INFRA_BODY}" |
          base64 -d 2>/dev/null || {
            echo "Corpo nao decodificou como base64:"
            printf '%s\n' "${CALLBACK_INFRA_BODY}"
          }
      else
        echo "A infraestrutura nao devolveu corpo."
      fi

      echo "-----------------------------------------------------"

      if [ "${CALLBACK_INFRA_STATUS:-}" != "success" ]; then
        echo "DEPLOY DE ${GN_VERSAO_APP:-?} NAO CONFIRMADO"
        echo "status=${CALLBACK_INFRA_STATUS:-vazio}"
        exit 1
      fi

      echo "DEPLOY CONFIRMADO"
      echo "${GN_VERSAO_APP} esta no ar em ${CALLBACK_INFRA_ENV:-teste}"