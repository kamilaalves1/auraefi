# GitLab CI/CD - AURA
#
# Deploy manual via docker-compose
# Sem build automático, sem SSH key
#
# Instruções:
# 1. SSH no servidor
# 2. docker-compose pull
# 3. docker-compose up -d
#
# Veja DEPLOY_SIMPLES.md para detalhes completos

# Este arquivo pode ficar vazio ou com um teste simples
test:
  stage: test
  image: alpine:latest
  script:
    - echo "AURA CI/CD - Deploy manual com docker-compose"
    - echo "Veja DEPLOY_SIMPLES.md no repositório"
  only:
    - master
