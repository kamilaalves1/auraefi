<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#060b14"/>
    </linearGradient>
    <linearGradient id="rayTop" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="rayMid" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="apexGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="blur4">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="blur8">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur2">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Ambient background glow -->
  <ellipse cx="128" cy="90" rx="88" ry="60" fill="#6d28d9" opacity="0.09" filter="url(#blur8)"/>

  <!-- Aurora rays — blurred glow layer beneath -->
  <polygon points="128,44 135,96 128,92 121,96" fill="#22d3ee" opacity="0.5" filter="url(#blur4)"/>
  <polygon points="128,50 118,88 112,82 122,50" fill="#a78bfa" opacity="0.4" filter="url(#blur4)"/>
  <polygon points="128,50 138,88 144,82 134,50" fill="#a78bfa" opacity="0.4" filter="url(#blur4)"/>
  <polygon points="128,56 102,80 97,73 122,56" fill="#7c3aed" opacity="0.25" filter="url(#blur4)"/>
  <polygon points="128,56 154,80 159,73 134,56" fill="#7c3aed" opacity="0.25" filter="url(#blur4)"/>

  <!-- Aurora rays — crisp on top -->
  <polygon points="128,46 133,94 128,91 123,94" fill="url(#rayTop)" opacity="0.95"/>
  <polygon points="128,52 119,87 114,83 123,52" fill="url(#rayMid)" opacity="0.8"/>
  <polygon points="128,52 137,87 142,83 133,52" fill="url(#rayMid)" opacity="0.8"/>
  <polygon points="128,58 104,79 100,74 124,58" fill="url(#rayMid)" opacity="0.45"/>
  <polygon points="128,58 152,79 156,74 132,58" fill="url(#rayMid)" opacity="0.45"/>

  <!-- "A" letterform — left leg -->
  <path d="M70 202 L107 92 L128 92 L128 92 L91 202 Z" fill="url(#letter)"/>
  <!-- "A" letterform — right leg -->
  <path d="M186 202 L149 92 L128 92 L165 202 Z" fill="url(#letter)"/>
  <!-- "A" crossbar -->
  <rect x="88" y="152" width="80" height="14" rx="5" fill="url(#letter)" opacity="0.88"/>

  <!-- Apex cap — bright dot with glow -->
  <circle cx="128" cy="90" r="18" fill="#22d3ee" opacity="0.12" filter="url(#blur4)"/>
  <circle cx="128" cy="90" r="6" fill="url(#apexGlow)" opacity="0.95"/>
  <circle cx="128" cy="90" r="3" fill="#e0f2fe" opacity="1"/>

  <!-- Subtle border -->
  <rect width="256" height="256" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1.5"/>
</svg>
