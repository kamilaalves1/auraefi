<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#111111"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c8cdd6"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="100%" stop-color="#f47920"/>
    </linearGradient>
    <linearGradient id="rayGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f47920" stop-opacity="0"/>
      <stop offset="100%" stop-color="#f47920" stop-opacity="0.7"/>
    </linearGradient>
    <filter id="blur6">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="blur3">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="blur10">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- Orange ambient glow behind apex -->
  <ellipse cx="128" cy="82" rx="70" ry="44" fill="#f47920" opacity="0.08" filter="url(#blur10)"/>

  <!-- Subtle orange rays — glow layer -->
  <polygon points="128,52 133,96 128,92 123,96" fill="#f47920" opacity="0.35" filter="url(#blur6)"/>
  <polygon points="128,58 116,90 110,84 122,58" fill="#f47920" opacity="0.18" filter="url(#blur6)"/>
  <polygon points="128,58 140,90 146,84 134,58" fill="#f47920" opacity="0.18" filter="url(#blur6)"/>

  <!-- Rays — crisp -->
  <polygon points="128,54 132,94 128,91 124,94" fill="url(#rayGrad)" opacity="0.9"/>
  <polygon points="128,60 117,88 112,83 123,60" fill="url(#rayGrad)" opacity="0.55"/>
  <polygon points="128,60 139,88 144,83 133,60" fill="url(#rayGrad)" opacity="0.55"/>

  <!-- "A" — left leg -->
  <path d="M68 205 L108 90 L128 90 L90 205 Z" fill="url(#letter)"/>
  <!-- "A" — right leg -->
  <path d="M188 205 L148 90 L128 90 L166 205 Z" fill="url(#letter)"/>
  <!-- "A" — crossbar -->
  <rect x="86" y="152" width="84" height="14" rx="5" fill="url(#letter)" opacity="0.9"/>

  <!-- Efí-style triangle apex — the signature diagonal arrow -->
  <!-- Outer orange glow -->
  <circle cx="128" cy="72" r="22" fill="#f47920" opacity="0.15" filter="url(#blur6)"/>
  <!-- The triangle (like the accent in Efí logo, pointing upper-right) -->
  <polygon points="114,82 142,52 142,78 118,82" fill="url(#orangeGrad)"/>
  <!-- Bright highlight on triangle -->
  <polygon points="135,55 142,52 142,62" fill="#ffcc80" opacity="0.5"/>

  <!-- Subtle border -->
  <rect width="256" height="256" rx="52" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
</svg>
